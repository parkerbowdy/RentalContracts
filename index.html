<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>J-Town Rental</title><link rel="stylesheet" href="theme.css"></head><body><header><img src="brand.svg" alt="J-Town Hardware and Rental"><div><h1 id="title">Rental Center</h1><nav><a href="manager.html">Manager</a><button id="account" class="alt hidden">Account</button><button id="logout" class="alt hidden">Sign out</button></nav></div></header><main><div id="status" role="status" aria-live="polite"></div><section id="pinScreen"><h2>Staff sign in</h2><p>Choose your station and enter the staff PIN.</p><div class="grid" id="stations"><button type="button" data-user="POS1">POS1</button><button type="button" data-user="POS2">POS2</button><button type="button" data-user="RENTAL">RENTAL</button></div><form id="pinForm"><label>Staff PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" required></label><button>Sign in</button></form><div id="pinStatus" role="status" aria-live="polite"></div></section><div id="app"></div></main><dialog id="modal"><div id="modalBody"></div><button id="closeModal" class="alt">Close</button></dialog><footer class="foot no-print">J-Town Hardware &amp; Rental · Staff access required · Epicor charges and refunds are handled separately.</footer><div id="clickTest" style="position:fixed;bottom:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:10px;font-weight:bold;display:none;z-index:9999"></div><script>document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=document.getElementById('clickTest');var name=b.textContent.trim()||b.id||'unnamed';t.textContent='Button clicked: '+name;t.style.display='block';setTimeout(function(){var s=document.getElementById('status');var extra=s&&s.textContent.trim()?(' | App status: '+s.textContent.trim()):' | App status: (empty)';if(name.indexOf('Complete rental')===0){var f=
